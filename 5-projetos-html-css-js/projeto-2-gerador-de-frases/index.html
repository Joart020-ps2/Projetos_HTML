<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de frases</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="painel">
    <span class="icone">💬</span>
    <h1>Gerador de frases</h1>
    <p class="instrucao">Precisa de uma inspiração? Sorteie uma frase!</p>
    <blockquote id="frase" aria-live="polite">Clique no botão para receber uma frase.</blockquote>
    <button id="botaoNovaFrase">Nova frase</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
