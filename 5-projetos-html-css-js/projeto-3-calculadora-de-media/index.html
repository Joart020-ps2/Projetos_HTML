<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de média</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="painel">
    <h1>Calculadora de média</h1>
    <p>Digite as três notas para descobrir sua média.</p>
    <form id="formulario">
      <label for="nota1">Primeira nota (0 a 10)</label>
      <input id="nota1" type="number" min="0" max="10" step="0.1" required>
      <label for="nota2">Segunda nota (0 a 10)</label>
      <input id="nota2" type="number" min="0" max="10" step="0.1" required>
      <label for="nota3">Terceira nota (0 a 10)</label>
      <input id="nota3" type="number" min="0" max="10" step="0.1" required>
      <button type="submit">Calcular média</button>
    </form>
    <section id="resultado" class="resultado" aria-live="polite"></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
