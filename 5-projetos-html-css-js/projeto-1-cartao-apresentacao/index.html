<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu cartão de apresentação</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cartao">
    <div class="avatar" aria-hidden="true">👋</div>
    <p class="etiqueta">OLÁ, EU SOU</p>
    <h1>Seu Nome</h1>
    <p class="descricao">Sou estudante e estou aprendendo desenvolvimento web.</p>
    <div class="interesses">
      <span>💻 Tecnologia</span>
      <span>🎮 Jogos</span>
      <span>🎵 Música</span>
    </div>
    <button id="botaoSaudacao">Clique para uma saudação</button>
    <p id="mensagem" class="mensagem" aria-live="polite"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
