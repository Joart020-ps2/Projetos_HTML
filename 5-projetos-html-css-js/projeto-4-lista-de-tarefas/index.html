<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="painel">
    <h1>Minhas tarefas</h1>
    <p>Organize suas atividades do dia.</p>
    <form id="formulario">
      <label class="sr-only" for="campoTarefa">Nova tarefa</label>
      <input id="campoTarefa" type="text" placeholder="Digite uma tarefa..." maxlength="100" required>
      <button type="submit">Adicionar</button>
    </form>
    <ul id="listaTarefas"></ul>
    <p id="contador" aria-live="polite">Nenhuma tarefa cadastrada.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
