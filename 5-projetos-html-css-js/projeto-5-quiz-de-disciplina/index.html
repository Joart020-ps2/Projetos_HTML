<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de disciplina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="painel">
    <header>
      <p class="etiqueta">DESAFIO DE CONHECIMENTOS</p>
      <h1>Quiz de tecnologia</h1>
    </header>
    <div id="areaQuiz">
      <div class="linha-progresso">
        <span id="numeroPergunta">Pergunta 1 de 5</span>
        <span id="pontuacao">Pontos: 0</span>
      </div>
      <div class="trilho"><div id="barraProgresso"></div></div>
      <h2 id="pergunta"></h2>
      <div id="alternativas" class="alternativas"></div>
      <p id="feedback" aria-live="polite"></p>
      <button id="botaoProxima" disabled>Próxima pergunta</button>
    </div>
    <section id="resultadoFinal" class="resultado-final" hidden>
      <h2>Quiz finalizado!</h2>
      <p id="mensagemFinal"></p>
      <button id="botaoReiniciar">Tentar novamente</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
